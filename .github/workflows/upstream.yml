name: Upstream

# Checks codex-acp nightly and publishes a patch release when the adapter/CLI chain changes.
on:
  schedule:
    # 02:00 Beijing time (18:00 UTC).
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: upstream-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      behind: ${{ steps.check.outputs.behind }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check for a new adapter release
        id: check
        run: |
          set -euo pipefail
          code=0
          deno task sync --check || code=$?
          case "$code" in
            0) echo "behind=false" >> "$GITHUB_OUTPUT" ;;
            20) echo "behind=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::sync --check failed with $code"; exit "$code" ;;
          esac

      - name: Pin upstream and bump the patch version
        id: bump
        if: steps.check.outputs.behind == 'true'
        run: |
          set -euo pipefail
          deno task sync

          CURRENT=$(grep -m1 '^version *=' orax.toml | sed -E 's/^version *= *"(.*)"/\1/')
          MAJOR=${CURRENT%%.*}
          REST=${CURRENT#*.}
          MINOR=${REST%%.*}
          PATCH=${REST#*.}
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          TAG="v${NEXT}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::${TAG} already exists; the version was bumped without a release"
            exit 1
          fi

          sed -i -E "s/^version = \"${CURRENT}\"/version = \"${NEXT}\"/" orax.toml
          jq --arg version "$NEXT" '.version = $version' deno.json > deno.json.tmp
          mv deno.json.tmp deno.json
          jq --arg version "$NEXT" '.version = $version' package.json > package.json.tmp
          mv package.json.tmp package.json

          ADAPTER=$(jq -r '.adapter.version' upstream.lock.json)
          CODEX=$(jq -r '.codex.version' upstream.lock.json)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "bumping ${CURRENT} -> ${NEXT} for codex-acp ${ADAPTER} (Codex CLI ${CODEX})"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orax.toml deno.json package.json upstream.lock.json
          git commit -m "Bundle codex-acp ${ADAPTER} (Codex CLI ${CODEX})"
          git tag "${TAG}"
          git push origin HEAD "${TAG}"

  release:
    needs: check
    if: needs.check.outputs.behind == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.check.outputs.tag }}
    permissions:
      contents: write
